# Stack de développement locale GRAVIA.
#
# Démarrage : `make dev` (ou `docker compose -f infra/docker-compose.yml --env-file .env up -d`)
# Toutes les variables ont une valeur par défaut : la stack démarre sans `.env`.
# Les identifiants ci-dessous sont des valeurs de DÉVELOPPEMENT uniquement ; en production
# ils proviennent d'AWS Secrets Manager (cf. Architecture_GRAVIA.md §7).
#
# Versions figées volontairement (cf. pyproject.toml pour le même principe côté Python) :
# une stack reproductible est une exigence du CDC, `latest` l'interdirait de fait.

# Nom de projet explicite. Sans lui, Docker Compose déduit le nom du dossier parent —
# ici `infra`, générique au point d'entrer en collision avec tout autre projet ayant un
# dossier `infra/` : les volumes seraient partagés et PostgreSQL refuserait de démarrer sur
# un répertoire de données initialisé par une autre version. Préfixe donc tout en `gravia_`.
name: gravia

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: infra/airflow/Dockerfile
  image: gravia-airflow:3.3.0-python3.12
  # Redémarrage automatique après un crash/redémarrage Docker, sauf arrêt manuel explicite —
  # `airflow-init` (one-shot) écrase cette valeur avec `restart: "no"` plus bas. Trouvé en
  # auditant la doc : Gouvernance/Architecture affirmaient déjà ce comportement sans qu'aucun
  # service de cette stack ne le configure.
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-BQhoJnCZAxMSPS7HrEtqTKZLXBoJ0Vw7Xkp1QY_9EGE=}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-gravia}:${POSTGRES_PASSWORD:-gravia}@postgres:5432/airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev-secret-key-change-in-prod}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-jwt-secret-change-in-prod}
    # Airflow 3.x utilise SimpleAuthManager par défaut (pas FAB) : il génère un mot de passe
    # aléatoire par utilisateur, imprimé une seule fois dans les logs au premier démarrage, sans
    # moyen de le figer (constaté en lisant simple_auth_manager.py — pas de champ mot de passe
    # dans `simple_auth_manager_users`, `_generate_password()` utilise `secrets` inconditionnellement).
    # `airflow users create --password admin` (commande FAB) échouait donc silencieusement
    # (`|| true`) et ne créait jamais l'utilisateur "admin/admin" documenté. En dev local
    # mono-poste, désactiver l'authentification est plus simple que suivre un mot de passe
    # généré à chaque recréation du volume Postgres.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # Sans ceci, chaque tâche appelle son API d'exécution sur son défaut codé en dur
    # (http://localhost:8080/execution/, cf. airflow/executors/base_executor.py::
    # get_execution_api_server_url) — correct seulement si apiserver et exécuteur de tâche
    # partagent le même conteneur. Ici scheduler (LocalExecutor) et airflow-apiserver sont deux
    # conteneurs séparés : chaque tâche doit joindre apiserver par son nom de service Docker
    # Compose, pas localhost. Constaté en testant : sans cette variable, toute tâche échoue en
    # quelques secondes avec `httpcore.ConnectError: [Errno 111] Connection refused` (rien
    # n'écoute sur localhost:8080 dans le conteneur scheduler).
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # PYTHONPATH avant le site-packages installé au build : les DAGs importent le code monté en
    # volume (../src), pas la copie figée au build de l'image (cf. infra/airflow/Dockerfile).
    PYTHONPATH: /opt/airflow/src
    # Les tâches accèdent au lac et au tracking via les mêmes endpoints que le code local.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MINIO_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    DATABASE_URL: postgresql://${POSTGRES_USER:-gravia}:${POSTGRES_PASSWORD:-gravia}@postgres:5432/${POSTGRES_DB:-gravia}
  volumes:
    - ../pipelines/airflow/dags:/opt/airflow/dags
    - ../src:/opt/airflow/src
    - ../data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- Stockage objet : couches Bronze et Silver (Parquet) ---
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Crée le bucket applicatif au premier démarrage puis s'arrête (conteneur one-shot).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-gravia} &&
      mc mb --ignore-existing local/mlflow &&
      echo 'Buckets prêts.'
      "

  # --- Base relationnelle : couche Gold (schéma en étoile) + métadonnées Airflow/MLflow ---
  postgres:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gravia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gravia}
      POSTGRES_DB: ${POSTGRES_DB:-gravia}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crée les bases annexes `airflow` et `mlflow` au premier démarrage.
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gravia}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Interface web pour naviguer la base Gold (contrairement à MinIO/MLflow/Grafana, PostgreSQL
  # n'a pas de UI web propre) : utile pour montrer gold_fact_accident et ses dimensions en direct
  # pendant une démo, sans écrire de SQL à la main. Variante "standalone" : image plus légère,
  # pas de dépendance PHP-FPM/nginx séparée.
  adminer:
    image: adminer:4.8.1-standalone
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      # Adminer charge automatiquement adminer.css s'il le trouve à côté de son index.php,
      # aucune configuration PHP nécessaire.
      - ./adminer/adminer.css:/var/www/html/adminer.css:ro
    depends_on:
      postgres:
        condition: service_healthy

  # --- Cache, provisionné : aucun module applicatif ne s'y connecte à ce jour (cf.
  # Architecture_GRAVIA.md §3) ---
  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Bus de messages, provisionné : aucun producteur/consommateur applicatif branché à ce
  # jour (cf. Architecture_GRAVIA.md §2.3/§3 — choix de périmètre assumé) ---
  redpanda:
    image: redpandadata/redpanda:v26.1.14
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"    # accès depuis les autres conteneurs
      - "19092:19092"  # accès depuis l'hôte
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # --- Tracking des expériences et registry des modèles ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    restart: unless-stopped
    # host.docker.internal dans --allowed-hosts ci-dessous : un client hors du réseau
    # docker-compose (ex. un Pod K8s sur un cluster kind, cf. gravia-mlops/k8s) joint MLflow via
    # ce nom, publié sur l'hôte — sans l'ajouter, MLflow refuse avec le même 403
    # « Invalid Host header » déjà rencontré pour `mlflow`/`localhost` (protection
    # anti-DNS-rebinding, cf. docs/AVANCEMENT_GRAVIA.md).
    command: >
      /bin/sh -c "
      pip install --no-cache-dir psycopg2-binary boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-gravia}:${POSTGRES_PASSWORD:-gravia}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000,host.docker.internal,host.docker.internal:5000
      "
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # --- Orchestration (Airflow 3) ---
  # Initialise la base de métadonnées, puis s'arrête (authentification désactivée en dev, cf.
  # AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS ci-dessous — aucun utilisateur à créer).
  airflow-init:
    <<: *airflow-common
    entrypoint: >
      /bin/bash -c "
      airflow db migrate
      "
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- API de prédiction temps réel : POST /v1/predict-severity (cf. CDC_GRAVIA.md, EF-5) ---
  serving:
    build:
      context: ..
      dockerfile: infra/serving/Dockerfile
    image: gravia-serving:python3.12
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Surveillance de l'infrastructure ---
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  minio-data:
  postgres-data:
  redis-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
  airflow-logs:
