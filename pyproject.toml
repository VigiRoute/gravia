[project]
name = "gravia"
version = "0.1.0"
description = "Aide à la décision pour la priorisation des secours routiers — prédiction de la gravité d'accidents (BAAC)"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "shap>=0.45",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "mlflow>=2.12",
    "great-expectations>=0.18",
    "evidently>=0.4",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]

# Airflow est lourd et géré via son image Docker (infra/docker-compose.yml),
# pas via les dépendances du package.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["gravia"]
