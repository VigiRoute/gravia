[project]
name = "gravia"
version = "0.1.0"
description = "Aide à la décision pour la priorisation des secours routiers — prédiction de la gravité d'accidents (BAAC)"
# Développé et testé sur CPython 3.12 uniquement (cf. .github/workflows).
requires-python = ">=3.12,<3.13"

# Versions FIGÉES (==) et non `>=`. Motif : les contraintes souples laissaient
# installer des majeures aux API incompatibles avec ce que documente le projet —
# `great-expectations>=0.18` résolvait en 1.x (réécriture complète de l'API),
# `mlflow>=2.12` en 3.x, `evidently>=0.4` en 0.7.x. Le jeu ci-dessous est celui
# sous lequel les notebooks d'exploration ont été validés (cf. notebooks/README.md) :
# eda_baseline_baac.py y reproduit recall 0,808 / F1 macro 0,708.
# Relever une version = refaire tourner les notebooks pour vérifier la reproductibilité.
dependencies = [
    # Traitement de données
    "polars==1.42.1",
    "pyarrow==24.0.0",
    # NB : pandas est plafonné à <3 par mlflow. Il tourne donc en 2.3.3 et non en 3.x,
    # sans effet sur les résultats (baseline revalidé à l'identique après rétrogradation).
    "pandas==2.3.3",
    "numpy==2.4.6",
    # Modélisation
    "scikit-learn==1.9.0",
    "lightgbm==4.6.0",
    "shap==0.52.0",
    # Persistance
    "SQLAlchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    # Serving
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "prometheus-fastapi-instrumentator==8.1.0",
    # Graphiques des résultats déjà publiés (docs/generate_result_charts.py) — déjà une
    # dépendance transitive de shap (ses propres visualisations SHAP), figée ici explicitement
    # car importée directement, pas seulement de passage.
    "matplotlib==3.11.1",
    # MLOps
    "mlflow==3.14.0",
    "great-expectations==1.19.1",
    "evidently==0.7.21",
    # Divers
    "boto3==1.43.56",
    "python-dotenv==1.2.2",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "black==26.5.1",
]

# Airflow (3.x) est lourd et géré via son image Docker (infra/docker-compose.yml),
# pas via les dépendances du package. Les DAGs visent l'API Airflow 3.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks/ = exploration (cf. structure du dépôt), pas du code de la solution : jamais
# soumis à ruff/black jusqu'ici, les y astreindre maintenant reformaterait des scripts
# d'analyse déjà validés sans rapport avec la CI ajoutée.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "notebooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["gravia", "ml"]
