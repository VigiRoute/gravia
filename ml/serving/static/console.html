<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAVIA — console de prédiction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Meme palette que index.html (theme clair). */
    --bg:#f4f4f5; --panel:#ffffff; --panel-2:#ececef;
    --ink:#18181b; --ink-dim:rgba(24,24,27,.55); --line:rgba(24,24,27,.12); --line-soft:rgba(24,24,27,.08);
    --accent:#16a34a; --accent-soft:rgba(22,163,74,.12);
    --grave:#dc2626; --grave-soft:rgba(220,38,38,.1);
    --safe:#16a34a; --safe-soft:rgba(22,163,74,.12);
    --input-bg:#f7f7f8;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Sora",system-ui,sans-serif;
    min-height:100vh;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  .shell{max-width:1180px;margin:0 auto;padding:0 18px 60px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 2px;border-bottom:1px solid var(--line);margin-bottom:22px;
  }
  .brand{font-size:18px;font-weight:700;letter-spacing:.01em;}
  .brand span{font-family:"IBM Plex Mono",monospace;font-weight:400;color:var(--accent);font-size:13px;margin-left:8px;}
  .status{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--safe);box-shadow:0 0 8px var(--safe);}

  .layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--line-soft);}
  .panel-form{padding:22px;}
  .panel-result{padding:22px;position:sticky;top:18px;min-height:460px;display:flex;flex-direction:column;}

  .section{margin-bottom:22px;}
  .section:last-of-type{margin-bottom:0;}
  .section-title{
    font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;text-transform:uppercase;
    letter-spacing:.12em;color:var(--accent);margin:0 0 12px;
    padding-bottom:6px;border-bottom:1px dashed var(--line);
  }
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 14px;}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  select,input[type=text],input[type=number],input[type=datetime-local]{
    width:100%;padding:7px 9px;border:1px solid var(--line-soft);
    background:var(--input-bg);color:var(--ink);font-size:13px;font-family:"IBM Plex Mono",monospace;
  }
  option{background:var(--panel-2);color:var(--ink);}
  input:focus,select:focus{outline:1px solid var(--accent);}

  .checks{display:flex;flex-wrap:wrap;gap:12px 18px;}
  .checks label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);}

  .run-row{display:flex;align-items:center;gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  button{
    background:var(--accent);color:#fff;border:none;
    padding:11px 24px;font-size:12.5px;font-weight:700;font-family:"IBM Plex Mono",monospace;
    text-transform:uppercase;letter-spacing:.08em;cursor:pointer;
  }
  button:hover{background:#15803d;}
  button:disabled{opacity:.5;cursor:wait;}
  #status{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-dim);}

  .empty{margin:auto;text-align:center;color:var(--ink-dim);font-size:13px;padding:20px;line-height:1.6;}

  .gauge-block{text-align:center;}
  .gauge-block svg{width:220px;height:auto;}
  .readout{font-family:"IBM Plex Mono",monospace;font-size:38px;font-weight:600;fill:var(--ink);}
  .readout-sub{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--ink-dim);}

  .verdict-pill{
    display:inline-block;margin:6px auto 4px;padding:6px 16px;font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  }
  .verdict-pill.grave{background:var(--grave-soft);color:var(--grave);}
  .verdict-pill.non_grave{background:var(--safe-soft);color:var(--safe);}

  .meta-row{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-dim);margin:14px 0 18px;padding:0 4px;}

  .shap-title{font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0 0 12px;}
  .shap-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .shap-row .feat{color:var(--ink-dim);}
  .shap-row .val{text-align:right;}
  .shap-row .val.up{color:var(--grave);}
  .shap-row .val.down{color:var(--safe);}
  .shap-track{grid-column:1 / -1;height:4px;background:var(--input-bg);position:relative;}
  .shap-track i{position:absolute;top:0;bottom:0;display:block;}
  .shap-track i.up{background:var(--grave);left:50%;}
  .shap-track i.down{background:var(--safe);right:50%;}

  .err{color:var(--grave);font-family:"IBM Plex Mono",monospace;font-size:12.5px;margin:auto;text-align:center;}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">GRAVIA<span>/v1/predict-severity</span></div>
    <div class="status"><i class="dot" id="apiDot"></i><span id="apiLabel">verification…</span></div>
  </header>

  <div class="layout">
    <section class="panel panel-form">
      <form id="f">
        <div class="section">
          <p class="section-title">Signalement</p>
          <div class="grid2">
            <div class="field"><label>Moment</label><input type="datetime-local" name="moment" required></div>
            <div class="field"><label>Département</label><input type="text" name="departement" value="75" required></div>
          </div>
        </div>

        <div class="section">
          <p class="section-title">Lieu</p>
          <div class="grid2">
            <div class="field"><label>Agglomération</label>
              <select name="agglomeration"><option value="true" selected>Oui</option><option value="false">Non</option></select>
            </div>
            <div class="field"><label>Intersection</label>
              <select name="intersection">
                <option value="1" selected>Hors intersection</option><option value="2">En X</option>
                <option value="3">En T</option><option value="4">En Y</option>
                <option value="5">Plus de 4 branches</option><option value="6">Giratoire</option>
                <option value="7">Place</option><option value="8">Passage à niveau</option>
                <option value="9">Autre</option><option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>Catégorie route</label>
              <select name="categorie_route">
                <option value="1">Autoroute</option><option value="2">Nationale</option>
                <option value="3">Départementale</option><option value="4" selected>Voie communale</option>
                <option value="5">Hors réseau public</option><option value="6">Parking</option>
                <option value="7">Métropole urbaine</option><option value="9">Autre</option>
              </select>
            </div>
            <div class="field"><label>Régime circulation</label>
              <select name="regime_circulation">
                <option value="1">Sens unique</option><option value="2" selected>Bidirectionnelle</option>
                <option value="3">Chaussées séparées</option><option value="4">Voies affect. variable</option>
                <option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>Nb voies</label><input type="number" name="nb_voies" value="2" min="0" required></div>
            <div class="field"><label>Voie réservée</label>
              <select name="voie_reservee">
                <option value="0" selected>Sans objet</option><option value="1">Piste cyclable</option>
                <option value="2">Bande cyclable</option><option value="3">Voie réservée</option>
                <option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>Profil route</label>
              <select name="profil_route">
                <option value="1" selected>Plat</option><option value="2">Pente</option>
                <option value="3">Sommet de côte</option><option value="4">Bas de côte</option>
                <option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>Tracé en plan</label>
              <select name="trace_plan">
                <option value="1" selected>Rectiligne</option><option value="2">Courbe à gauche</option>
                <option value="3">Courbe à droite</option><option value="4">En S</option>
                <option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>Vitesse max (km/h)</label><input type="number" name="vitesse_max" value="50" min="0" required></div>
            <div class="field"><label>Infrastructure</label>
              <select name="infrastructure">
                <option value="0" selected>Aucun</option><option value="1">Souterrain / tunnel</option>
                <option value="2">Pont / autopont</option><option value="3">Bretelle d'échangeur</option>
                <option value="4">Voie ferrée</option><option value="5">Carrefour aménagé</option>
                <option value="6">Zone piétonne</option><option value="7">Zone de péage</option>
                <option value="8">Chantier</option><option value="9">Autres</option>
                <option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>Situation</label>
              <select name="situation">
                <option value="1" selected>Sur chaussée</option><option value="2">Bande d'arrêt d'urgence</option>
                <option value="3">Accotement</option><option value="4">Trottoir</option>
                <option value="5">Piste cyclable</option><option value="6">Autre voie spéciale</option>
                <option value="8">Autres</option><option value="0">Aucun</option>
                <option value="-1">Non renseigné</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section">
          <p class="section-title">Conditions</p>
          <div class="grid2">
            <div class="field"><label>Luminosité</label>
              <select name="luminosite">
                <option value="1" selected>Plein jour</option><option value="2">Crépuscule / aube</option>
                <option value="3">Nuit sans éclairage</option>
                <option value="4">Nuit, éclairage éteint</option>
                <option value="5">Nuit, éclairage allumé</option>
              </select>
            </div>
            <div class="field"><label>Météo</label>
              <select name="meteo">
                <option value="1" selected>Normale</option><option value="2">Pluie légère</option>
                <option value="3">Pluie forte</option><option value="4">Neige / grêle</option>
                <option value="5">Brouillard / fumée</option><option value="6">Vent fort / tempête</option>
                <option value="7">Temps éblouissant</option><option value="8">Temps couvert</option>
                <option value="9">Autre</option><option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>État surface</label>
              <select name="etat_surface">
                <option value="1" selected>Normale</option><option value="2">Mouillée</option>
                <option value="3">Flaques</option><option value="4">Inondée</option>
                <option value="5">Enneigée</option><option value="6">Boue</option>
                <option value="7">Verglacée</option><option value="8">Corps gras / huile</option>
                <option value="9">Autre</option><option value="-1">Non renseigné</option>
              </select>
            </div>
            <div class="field"><label>Type collision</label>
              <select name="type_collision">
                <option value="1">2 véh., frontale</option><option value="2">2 véh., arrière</option>
                <option value="3" selected>2 véh., côté</option><option value="4">3+ véh., chaîne</option>
                <option value="5">3+ véh., multiples</option><option value="6">Autre collision</option>
                <option value="7">Sans collision</option><option value="-1">Non renseigné</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section">
          <p class="section-title">Véhicules &amp; usagers</p>
          <div class="grid2" style="margin-bottom:12px;">
            <div class="field"><label>Nb véhicules</label><input type="number" name="nb_vehicules" value="2" min="0" required></div>
          </div>
          <div class="checks">
            <label><input type="checkbox" name="flag_2roues_motorise" checked> Deux-roues motorisé</label>
            <label><input type="checkbox" name="flag_poids_lourd"> Poids lourd / bus / car</label>
            <label><input type="checkbox" name="flag_velo_edp"> Vélo / EDP</label>
            <label><input type="checkbox" name="flag_pieton"> Piéton</label>
          </div>
        </div>

        <div class="run-row">
          <button type="submit">Lancer la prédiction</button>
          <span id="status"></span>
        </div>
      </form>
    </section>

    <aside class="panel panel-result">
      <div class="empty" id="emptyState">En attente — remplis le formulaire et lance une prédiction pour voir le résultat ici.</div>
      <div id="result" hidden></div>
    </aside>
  </div>
</div>

<script>
const form = document.getElementById('f');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const emptyEl = document.getElementById('emptyState');
const apiDot = document.getElementById('apiDot');
const apiLabel = document.getElementById('apiLabel');

form.moment.value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

fetch('/health').then(r => r.json()).then(d => {
  apiLabel.textContent = 'modèle v' + d.modele_version;
}).catch(() => {
  apiDot.style.background = 'var(--grave)';
  apiDot.style.boxShadow = '0 0 8px var(--grave)';
  apiLabel.textContent = 'indisponible';
});

function toPayload(fd) {
  const bools = new Set(['agglomeration', 'flag_2roues_motorise', 'flag_poids_lourd', 'flag_velo_edp', 'flag_pieton']);
  const ints = new Set(['intersection','categorie_route','regime_circulation','nb_voies','voie_reservee',
    'profil_route','trace_plan','vitesse_max','infrastructure','situation','luminosite','meteo',
    'etat_surface','type_collision','nb_vehicules']);
  const payload = {};
  for (const [key, value] of fd.entries()) {
    if (bools.has(key)) payload[key] = (value === 'true');
    else if (ints.has(key)) payload[key] = parseInt(value, 10);
    else payload[key] = value;
  }
  for (const name of ['flag_2roues_motorise','flag_poids_lourd','flag_velo_edp','flag_pieton','agglomeration']) {
    payload[name] = form.elements[name].type === 'checkbox' ? form.elements[name].checked : payload[name];
  }
  return payload;
}

function arcPoint(pct, r) {
  const angle = Math.PI * (1 - pct / 100);
  return { x: 100 + r * Math.cos(angle), y: 100 - r * Math.sin(angle) };
}

function renderResult(data) {
  const isGrave = data.gravite_predite === 'grave';
  const pct = Math.round(data.probabilite * 1000) / 10;
  const seuilPct = Math.round(data.seuil_decision * 1000) / 10;
  const color = isGrave ? 'var(--grave)' : 'var(--safe)';
  const tick = arcPoint(seuilPct, 85);

  const shap = data.top_contributions.map(c => {
    const up = c.contribution >= 0;
    const width = Math.min(Math.abs(c.contribution) * 44, 50);
    const style = up ? `left:50%;width:${width}%;` : `right:50%;width:${width}%;`;
    return `<div class="shap-row">
      <span class="feat">${c.feature}</span>
      <span class="val ${up ? 'up' : 'down'}">${c.contribution >= 0 ? '+' : ''}${c.contribution.toFixed(3)}</span>
      <div class="shap-track"><i class="${up ? 'up' : 'down'}" style="${style}"></i></div>
    </div>`;
  }).join('');

  resultEl.innerHTML = `
    <div class="gauge-block">
      <svg viewBox="0 0 200 115">
        <path d="M 15 100 A 85 85 0 0 1 185 100" fill="none" stroke="var(--line-soft)" stroke-width="14" stroke-linecap="round" pathLength="100"/>
        <path d="M 15 100 A 85 85 0 0 1 185 100" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
              pathLength="100" stroke-dasharray="${pct} 100"/>
        <line x1="${tick.x}" y1="${tick.y - 10}" x2="${tick.x}" y2="${tick.y + 10}" stroke="var(--ink)" stroke-width="3"/>
        <text x="100" y="88" text-anchor="middle" class="readout">${pct}%</text>
        <text x="100" y="106" text-anchor="middle" class="readout-sub">seuil ${seuilPct}%</text>
      </svg>
      <div class="verdict-pill ${data.gravite_predite}">${isGrave ? 'Grave' : 'Non grave'}</div>
    </div>
    <div class="meta-row"><span>modèle</span><span>v${data.modele_version}</span></div>
    <p class="shap-title">Contributions SHAP</p>
    <div class="shap-list">${shap}</div>
  `;
  emptyEl.hidden = true;
  resultEl.hidden = false;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = form.querySelector('button');
  btn.disabled = true;
  statusEl.textContent = 'prédiction en cours…';
  try {
    const payload = toPayload(new FormData(form));
    payload.moment = new Date(form.moment.value).toISOString();
    const res = await fetch('/v1/predict-severity', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`${res.status} : ${body}`);
    }
    renderResult(await res.json());
    statusEl.textContent = '';
  } catch (err) {
    emptyEl.hidden = true;
    resultEl.hidden = false;
    resultEl.innerHTML = `<p class="err">Échec : ${err.message}</p>`;
    statusEl.textContent = '';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
